services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aurel
      POSTGRES_PASSWORD: aurel_dev_password
      POSTGRES_DB: aurel
    ports:
      - "5442:5432"
    volumes:
      - aurel_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurel -d aurel"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aurel_db_data:
